name: tmp-nasa-earth-assets

on:
  push:
    branches:
      - tmp/nasa-earth-assets-20260728
  pull_request:
    branches:
      - v2

permissions:
  contents: read

jobs:
  package-nasa-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download NASA SVS Earth textures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nasa-earth-assets
          curl --fail --location --retry 5 --retry-delay 3 \
            --output nasa-earth-assets/flat-earth-clouds-2048.jpg \
            https://svs.gsfc.nasa.gov/vis/a000000/a003600/a003615/flat_earth03.jpg
          curl --fail --location --retry 5 --retry-delay 3 \
            --output nasa-earth-assets/earth-no-clouds-2048.jpg \
            https://svs.gsfc.nasa.gov/vis/a000000/a003600/a003615/earth_noClouds.0330.jpg
          curl --fail --location --retry 5 --retry-delay 3 \
            --output nasa-earth-assets/flat-earth-clouds-8192.jpg \
            https://svs.gsfc.nasa.gov/vis/a000000/a003600/a003615/flat_earth_Largest_still.0330.jpg
          curl --fail --location --retry 5 --retry-delay 3 \
            --output nasa-earth-assets/blue-marble-2048.png \
            https://svs.gsfc.nasa.gov/vis/a000000/a002900/a002915/bluemarble-2048.png
          sha256sum nasa-earth-assets/* > nasa-earth-assets/SHA256SUMS.txt
          ls -lh nasa-earth-assets

      - name: Upload NASA texture artifact
        uses: actions/upload-artifact@v4
        with:
          name: crisis-nasa-earth-assets
          path: nasa-earth-assets
          if-no-files-found: error
          retention-days: 1
